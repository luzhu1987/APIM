name: APIM Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      tfvars:
        description: 'Optional tfvars filename under APIM/env, for example cn-int.tfvars'
        required: false
        default: ''

jobs:
  terraform:
    name: Terraform APIM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APIM/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.8

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          if [[ -n "${{ github.event.inputs.tfvars }}" ]]; then
            terraform plan -var-file="../env/${{ github.event.inputs.tfvars }}" -out=plan.tfplan
          else
            terraform plan -out=plan.tfplan
          fi

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve plan.tfplan
